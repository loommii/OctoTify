[supervisord]
nodaemon=true  # 前台运行（容器必须）
logfile=/dev/null
logfile_maxbytes=0

# 后端服务：Go HTTP 服务器
[program:backend]
command=/app/octotify --config /app/config/config.yaml
autostart=true          # 容器启动时自动运行
autorestart=true        # 崩溃后自动重启
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true    # 标准错误合并到标准输出

# Nginx 服务：反向代理前端静态文件
[program:nginx]
command=nginx -g "daemon off;"  # 前台运行
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
