# OctoTify 配置文件

server:
  # 服务名称，健康检查 /ping 接口返回
  name: OctoTify
  # 服务监听端口
  port: 34123
  # 运行模式：debug（开发）/ release（生产）
  mode: debug

database:
  # SQLite 数据库文件路径
  path: ./data/octotify.db

log:
  # 日志级别：debug / info / warn / error / fatal
  level: debug
  # 日志格式：console（控制台，开发环境）/ json（结构化，生产环境）
  format: json
  # 输出目标：
  #   - stdout：仅输出到标准输出（控制台）
  #   - stderr：仅输出到标准错误
  #   - file：同时输出到文件和控制台，并启用日志轮转
  output: file
  # 日志文件路径
  log_file: ./data/log/octotify.log
  # 错误日志文件路径
  error_file: ./data/log/error.log
  # 是否在 DEBUG 等级下打印完整的请求和响应信息（包括请求头、请求体、响应头、响应体）
  # true: 打印完整信息（不脱敏），适合开发调试
  # false: 仅打印基本请求信息（方法、路径、状态码、耗时），适合生产环境
  debug_body: true

jwt:
  # RSA 私钥路径（用于签名）
  private_key_path: ./config/keys/private.pem
  # RSA 公钥路径（用于验证）
  public_key_path: ./config/keys/public.pem
  # Access Token 有效期（Go time.Duration 格式）
  access_ttl: 1h
  # Refresh Token 有效期（Go time.Duration 格式）
  refresh_ttl: 168h
  # 是否自动生成密钥对（true: 密钥不存在时自动生成，适合新手用户；false: 密钥不存在时启动失败，适合生产环境）
  auto_generate_keys: true
