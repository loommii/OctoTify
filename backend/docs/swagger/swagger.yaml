basePath: /api
definitions:
  octotify_internal_handler_dto.AuthResp:
    description: 认证成功后返回的 Access Token、Refresh Token 和用户信息
    properties:
      access_token:
        description: 访问令牌，有效期 1 小时
        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        description: 刷新令牌，有效期 7 天
        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        allOf:
        - $ref: '#/definitions/octotify_internal_handler_dto.UserDTO'
        description: 用户信息
    type: object
  octotify_internal_handler_dto.ChangePasswordReq:
    description: 修改用户登录密码
    properties:
      new_password:
        description: 新密码，8-128 个字符，需包含大小写字母和数字
        example: NewP@ssw0rd123
        type: string
      old_password:
        description: 旧密码
        example: OldP@ssw0rd123
        type: string
    required:
    - new_password
    - old_password
    type: object
  octotify_internal_handler_dto.ChannelDTO:
    description: 推送渠道的详细信息
    properties:
      config:
        description: 渠道配置，JSON 格式
        type: object
      created_at:
        description: 创建时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      id:
        description: 渠道 ID
        example: 1
        type: integer
      last_used_at:
        description: 最后使用时间（Unix 毫秒时间戳，0 表示未使用）
        example: 1714636800000
        type: integer
      name:
        description: 渠道名称
        example: 钉钉-运维群
        type: string
      status:
        description: 状态：1-启用 2-停用 -1-已删除
        example: 1
        type: integer
      type:
        description: 渠道类型：wechat, telegram, dingtalk, email, webhook
        example: dingtalk
        type: string
      updated_at:
        description: 更新时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      user_id:
        description: 所属用户 ID
        example: 1
        type: integer
    type: object
  octotify_internal_handler_dto.ChannelTypeMeta:
    properties:
      config_fields:
        description: 配置字段定义
        items:
          $ref: '#/definitions/octotify_internal_handler_dto.ConfigField'
        type: array
      description:
        description: 描述
        type: string
      name:
        description: 渠道类型名称
        type: string
      type:
        description: 渠道类型标识
        type: string
    type: object
  octotify_internal_handler_dto.ConfigField:
    properties:
      label:
        description: 字段标签
        type: string
      name:
        description: 字段名称
        type: string
      placeholder:
        description: 占位符提示
        type: string
      required:
        description: 是否必填
        type: boolean
      type:
        description: 字段类型：string, number, password, url
        type: string
    type: object
  octotify_internal_handler_dto.CreateChannelReq:
    description: '创建新的推送渠道，需要指定渠道类型、名称和配置信息 ## 渠道配置示例 - wechat: {"webhook": "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"}
      - telegram: {"bot_token": "xxx", "chat_id": "xxx"} - dingtalk: {"webhook": "https://oapi.dingtalk.com/robot/send?access_token=xxx"}
      - email: {"smtp_host": "smtp.example.com", "smtp_port": 587, "username": "xxx",
      "password": "xxx", "to": "xxx@example.com"} - webhook: {"url": "https://example.com/webhook",
      "method": "POST", "headers": {"Content-Type": "application/json"}} - feishu:
      {"webhook_url": "https://open.feishu.cn/open-apis/bot/v2/hook/xxx", "secret":
      ""}'
    properties:
      config:
        description: 渠道配置，JSON 格式，不同渠道类型配置不同
        type: object
      name:
        description: 渠道名称，1-128 个字符
        example: 钉钉-运维群
        maxLength: 128
        minLength: 1
        type: string
      type:
        description: 渠道类型，可选值：wechat, telegram, dingtalk, email, webhook
        example: dingtalk
        type: string
    required:
    - config
    - name
    - type
    type: object
  octotify_internal_handler_dto.CreateSourceReq:
    description: 创建新的消息来源，系统自动生成 Source Token
    properties:
      channel_ids:
        description: 关联的渠道ID列表
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      description:
        description: 来源描述，最多 512 个字符
        example: GitHub Actions 构建通知
        maxLength: 512
        type: string
      name:
        description: 来源名称，1-128 个字符
        example: CI Pipeline
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  octotify_internal_handler_dto.LoginReq:
    description: 用户登录时使用的请求参数
    properties:
      password:
        description: 密码，8-128 个字符，需包含大小写字母和数字
        example: P@ssw0rd123
        type: string
      username:
        description: 用户名，3-64 个字符，仅允许字母、数字和下划线
        example: octotify
        type: string
    required:
    - password
    - username
    type: object
  octotify_internal_handler_dto.MessageDTO:
    description: 消息列表中的单条消息记录
    properties:
      channel_id:
        description: 渠道 ID
        example: 1
        type: integer
      content:
        description: 消息内容
        example: 'Build #123 passed'
        type: string
      created_at:
        description: 创建时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      id:
        description: 消息 ID
        example: 1
        type: integer
      source_id:
        description: 来源 ID
        example: 1
        type: integer
      status:
        description: 推送状态：100-待推送 200-成功 300-失败 -1-已删除
        example: 200
        type: integer
      title:
        description: 消息标题
        example: CI Build
        type: string
      updated_at:
        description: 更新时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
    type: object
  octotify_internal_handler_dto.MessageDetailDTO:
    description: 单条消息的详细信息，包含来源名称、渠道名称和类型
    properties:
      channel_id:
        description: 渠道 ID
        example: 1
        type: integer
      channel_name:
        description: 渠道名称
        example: 钉钉-运维群
        type: string
      channel_type:
        description: 渠道类型：wechat, telegram, dingtalk, email, webhook
        example: dingtalk
        type: string
      content:
        description: 消息内容
        example: 'Build #123 passed'
        type: string
      created_at:
        description: 创建时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      id:
        description: 消息 ID
        example: 1
        type: integer
      source_id:
        description: 来源 ID
        example: 1
        type: integer
      source_name:
        description: 来源名称
        example: CI Pipeline
        type: string
      status:
        description: 推送状态：100-待推送 200-成功 300-失败 -1-已删除
        example: 200
        type: integer
      title:
        description: 消息标题
        example: CI Build
        type: string
      updated_at:
        description: 更新时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
    type: object
  octotify_internal_handler_dto.PushMessageReq:
    description: 外部系统通过 Source Token 推送消息时使用的请求参数
    properties:
      message:
        description: 消息内容，不能为空
        example: 'Build #123 passed'
        minLength: 1
        type: string
      title:
        description: 消息标题，1-256 个字符
        example: CI Build
        maxLength: 256
        minLength: 1
        type: string
    required:
    - message
    - title
    type: object
  octotify_internal_handler_dto.PushResponse:
    description: 消息推送接口的返回结果，包含各渠道的推送详情
    properties:
      failed:
        description: 推送失败数
        type: integer
      results:
        description: 各渠道推送结果详情
        items:
          $ref: '#/definitions/octotify_internal_handler_dto.PushResult'
        type: array
      success:
        description: 推送成功数
        type: integer
      total:
        description: 推送渠道总数
        type: integer
    type: object
  octotify_internal_handler_dto.PushResult:
    description: 并发推送到多个渠道时，单个渠道的推送结果
    properties:
      channel_id:
        description: 渠道 ID
        type: integer
      channel_name:
        description: 渠道名称
        type: string
      error:
        description: 失败时的错误信息
        type: string
      message_id:
        description: 消息 ID
        type: integer
      success:
        description: 是否推送成功
        type: boolean
    type: object
  octotify_internal_handler_dto.RefreshReq:
    description: 使用 Refresh Token 获取新的 Access Token
    properties:
      refresh_token:
        description: Refresh Token，登录时获取
        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  octotify_internal_handler_dto.RegisterReq:
    description: 注册新用户时使用的请求参数
    properties:
      password:
        description: 密码，8-128 个字符，需包含大小写字母和数字
        example: P@ssw0rd123
        type: string
      username:
        description: 用户名，3-64 个字符，仅允许字母、数字和下划线
        example: octotify
        type: string
    required:
    - password
    - username
    type: object
  octotify_internal_handler_dto.SourceDTO:
    description: 消息来源的基本信息，不包含 Token
    properties:
      created_at:
        description: 创建时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      description:
        description: 来源描述
        example: GitHub Actions 构建通知
        type: string
      id:
        description: 来源 ID
        example: 1
        type: integer
      name:
        description: 来源名称
        example: CI Pipeline
        type: string
      status:
        description: 状态：1-启用 2-停用 -1-已删除
        example: 1
        type: integer
      token:
        description: 推送 Token（仅创建时返回）
        example: src0196a3b2c4d50000a1b2c3d4e5f67890
        type: string
      user_id:
        description: 所属用户 ID
        example: 1
        type: integer
    type: object
  octotify_internal_handler_dto.SourceDetailDTO:
    description: 消息来源的详细信息，包含 Token 和使用时间
    properties:
      created_at:
        description: 创建时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      description:
        description: 来源描述
        example: GitHub Actions 构建通知
        type: string
      id:
        description: 来源 ID
        example: 1
        type: integer
      last_used_at:
        description: 最后使用时间（Unix 毫秒时间戳，0 表示未使用）
        example: 1714636800000
        type: integer
      name:
        description: 来源名称
        example: CI Pipeline
        type: string
      status:
        description: 状态：1-启用 2-停用 -1-已删除
        example: 1
        type: integer
      token:
        description: 推送 Token
        example: src0196a3b2c4d50000a1b2c3d4e5f67890
        type: string
      updated_at:
        description: 更新时间（Unix 毫秒时间戳）
        example: 1714636800000
        type: integer
      user_id:
        description: 所属用户 ID
        example: 1
        type: integer
    type: object
  octotify_internal_handler_dto.SourceDetailResponse:
    description: 来源详情及其已绑定的有效渠道列表
    properties:
      channels:
        description: 已绑定渠道列表
        items:
          $ref: '#/definitions/octotify_internal_handler_dto.ChannelDTO'
        type: array
      source:
        allOf:
        - $ref: '#/definitions/octotify_internal_handler_dto.SourceDetailDTO'
        description: 来源详情
    type: object
  octotify_internal_handler_dto.SourceTokenResponse:
    description: 查看或重置来源令牌时返回的 Token 值
    properties:
      token:
        description: 推送 Token
        example: src0196a3b2c4d50000a1b2c3d4e5f67890
        type: string
    type: object
  octotify_internal_handler_dto.UpdateChannelReq:
    description: '编辑已有推送渠道的名称和配置信息 ## 渠道配置示例 - wechat: {"webhook": "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"}
      - telegram: {"bot_token": "xxx", "chat_id": "xxx"} - dingtalk: {"webhook": "https://oapi.dingtalk.com/robot/send?access_token=xxx"}
      - email: {"smtp_host": "smtp.example.com", "smtp_port": 587, "username": "xxx",
      "password": "xxx", "to": "xxx@example.com"} - webhook: {"url": "https://example.com/webhook",
      "method": "POST", "headers": {"Content-Type": "application/json"}}'
    properties:
      config:
        description: 渠道配置，JSON 格式，不同渠道类型配置不同
        type: object
      name:
        description: 渠道名称，1-128 个字符
        example: 钉钉-运维群
        maxLength: 128
        minLength: 1
        type: string
    required:
    - config
    - name
    type: object
  octotify_internal_handler_dto.UpdateSourceReq:
    description: 编辑已有消息来源的名称和描述
    properties:
      description:
        description: 来源描述，最多 512 个字符
        example: GitHub Actions 构建通知
        maxLength: 512
        type: string
      name:
        description: 来源名称，1-128 个字符
        example: CI Pipeline
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  octotify_internal_handler_dto.UserDTO:
    description: 用户基本信息，用于登录/注册/刷新令牌等接口返回
    properties:
      created_at:
        description: 创建时间（Unix 时间戳）
        example: 1714636800
        type: integer
      id:
        description: 用户 ID
        example: 1
        type: integer
      username:
        description: 用户名
        example: octotify
        type: string
    type: object
  octotify_internal_handler_dto.VerifyPasswordReq:
    description: 需要密码二次验证的接口（查看令牌、重置令牌、停用/启用/删除来源）
    properties:
      password:
        description: 用户密码
        example: P@ssw0rd123
        type: string
    required:
    - password
    type: object
  octotify_pkg_response.PageResult:
    description: 所有分页接口返回的数据结构
    properties:
      list:
        description: 数据列表
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页条数
        type: integer
      total:
        description: 总记录数
        type: integer
    type: object
  octotify_pkg_response.Response:
    description: 所有 API 接口返回的统一格式，包含业务状态码、消息和数据
    properties:
      code:
        description: 业务状态码，0 表示成功，非 0 表示失败
        type: integer
      data:
        description: 业务数据，成功时返回业务数据，失败时可能为空或错误详情
      msg:
        description: 提示信息，成功时为"请求成功"，失败时为错误描述
        type: string
    type: object
host: localhost:34123
info:
  contact:
    name: OctoTify API Support
    url: https://github.com/OctoTify
  description: |-
    OctoTify 是一个消息总线平台，支持多种消息来源和推送渠道。
    核心功能：消息来源管理、推送渠道管理、消息推送与记录。
    本文档为前端开发人员提供完整的 API 接口说明，包含请求参数、响应格式、错误码等详细信息。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: OctoTify API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        使用用户名和密码登录系统，登录成功后返回 Access Token 和 Refresh Token。
        Access Token 有效期 1 小时，用于调用需要认证的接口。
        Refresh Token 有效期 7 天，用于刷新 Access Token。
        ## 密码要求
        - 8-128 个字符
        - 必须包含小写字母
        - 必须包含大写字母
        - 必须包含数字
        ## 使用场景
        1. 用户首次访问系统时进行登录
        2. Refresh Token 过期后重新登录
        ## 注意事项
        - 登录成功后请妥善保存 Access Token 和 Refresh Token
        - Access Token 过期后请使用 Refresh Token 调用刷新接口
        - 连续多次登录失败不会锁定账户
        ## 错误码说明
        - 110200: 用户名或密码错误
        - 110201: 登录失败
      parameters:
      - description: 登录请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回认证信息
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.AuthResp'
              type: object
      summary: 用户登录
      tags:
      - 用户认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        撤销当前用户的所有 Refresh Token，退出登录后需要重新登录才能访问系统。
        ## 注意事项
        - Access Token 在过期前仍有效（JWT 无状态特性，最长 1 小时后自动失效）
        - 前端需主动清除本地存储的 Access Token 和 Refresh Token
        - 退出登录后，所有使用旧 Refresh Token 的刷新请求都会失败
        ## 错误码说明
        - 100001: 未提供认证令牌或认证令牌无效或已过期
        - 110304: 退出登录失败
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 用户认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        使用 Refresh Token 获取新的 Access Token 和 Refresh Token。
        每次刷新都会返回新的 Access Token 和 Refresh Token，旧 Refresh Token 继续有效。
        ## 使用场景
        1. Access Token 过期（1 小时后）时调用此接口
        2. 前端应在请求收到 401 响应时自动调用此接口
        ## 注意事项
        - Refresh Token 有效期 7 天，过期后需重新登录
        - 刷新成功后请更新本地存储的 Access Token 和 Refresh Token
        - 如果 Refresh Token 已被撤销（如退出登录、修改密码），则无法刷新
        ## 错误码说明
        - 110300: 刷新令牌无效
        - 110301: 刷新令牌已撤销
        - 110302: 刷新令牌已过期
        - 110303: 刷新令牌失败
      parameters:
      - description: 刷新令牌请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.AuthResp'
              type: object
      summary: 刷新令牌
      tags:
      - 用户认证
  /channel-types:
    get:
      consumes:
      - application/json
      description: |-
        获取系统支持的所有推送渠道类型及其配置字段定义，用于前端动态渲染创建渠道表单。
        ## 使用场景
        1. 打开创建渠道页面时获取支持的渠道类型列表
        2. 根据 config_fields 动态生成配置表单
        ## 返回数据说明
        每个渠道类型包含：
        - type: 渠道类型标识（如 feishu, dingtalk, wechat 等）
        - name: 渠道类型名称（如 飞书, 钉钉, 企业微信 等）
        - description: 渠道类型描述
        - config_fields: 配置字段定义列表，用于前端动态表单渲染
        ## 错误码说明
        - 100001: 未提供认证令牌
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/octotify_internal_handler_dto.ChannelTypeMeta'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取渠道类型元数据
      tags:
      - 推送渠道管理
  /channels:
    get:
      consumes:
