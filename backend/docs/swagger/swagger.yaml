    post:
      consumes:
      - application/json
      description: |-
        创建一个新的消息来源，系统自动生成 Source Token，用于外部系统推送消息。
        ## 使用场景
        1. CI/CD 流水线创建为消息来源
        2. 监控系统创建为消息来源
        3. 业务系统创建为消息来源
        ## 注意事项
        - Source Token 仅在创建时返回一次，请妥善保存
        - 如忘记 Token，可通过查看令牌接口获取（需密码验证）
        - 来源创建后默认启用状态
        - 每个来源可绑定多个推送渠道
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 120100: 来源名称已存在
        - 120101: 创建来源失败
      parameters:
      - description: 创建消息来源请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.CreateSourceReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.SourceDTO'
              type: object
      security:
      - BearerAuth: []
      summary: 创建消息来源
      tags:
      - 消息来源管理
  /sources/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        软删除指定消息来源及其关联渠道关系，需要密码二次验证。删除后来源和所有关联数据不可恢复。
        ## 使用场景
        1. 永久删除不再使用的来源
        2. 清理测试数据
        ## 注意事项
        - 删除是软删除，数据库中标记为已删除状态
        - 删除后该来源的 Token 立即失效
        - 关联的渠道关系也会被删除
        - 只能删除自己创建的来源
        - 注意：DELETE 请求需在 Body 中传递密码（{"password": "xxx"}），主流网关均支持此用法
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 密码错误
        - 120102: 来源不存在
        - 120103: 无权限操作
        - 120107: 删除来源失败
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 密码验证请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.VerifyPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 删除消息来源
      tags:
      - 消息来源管理
    get:
      consumes:
      - application/json
      description: |-
        查询指定消息来源的详细信息，包含来源 Token、使用时间和已绑定的有效渠道列表。
        ## 使用场景
        1. 来源详情页展示
        2. 查看来源绑定的渠道
        3. 查看来源的推送 Token
        ## 注意事项
        - 返回的 Token 可用于推送消息接口
        - 渠道列表只包含启用状态的渠道
        - 只能查看自己创建的来源
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 120102: 来源不存在
        - 120103: 无权限查看
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.SourceDetailResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 查看来源详情
      tags:
      - 消息来源管理
    put:
      consumes:
      - application/json
      description: |-
        编辑消息来源的名称和描述，不影响已绑定的渠道和推送功能。
        ## 使用场景
        1. 修改来源名称使其更易识别
        2. 更新来源描述信息
        ## 注意事项
        - 只能编辑自己创建的来源
        - 名称不能与其他来源重复
        - 编辑后不影响 Source Token
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 120100: 来源名称已存在
        - 120102: 来源不存在
        - 120103: 无权限编辑
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 编辑消息来源请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.UpdateSourceReq'
      produces:
      - application/json
      responses:
        "200":
          description: 编辑成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 编辑消息来源
      tags:
      - 消息来源管理
  /sources/{id}/disable:
    put:
      consumes:
      - application/json
      description: |-
        停用指定消息来源，需要密码二次验证，停用后该来源无法推送消息。
        ## 使用场景
        1. 临时停止某个来源的消息推送
        2. 来源不再使用时停用而非删除
        ## 注意事项
        - 停用后使用该 Token 推送的消息会被拒绝
        - 已推送的历史消息不受影响
        - 可以随时重新启用
        - 只能停用自己创建的来源
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 密码错误
        - 120102: 来源不存在
        - 120103: 无权限操作
        - 120105: 来源已停用
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 密码验证请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.VerifyPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 停用成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 停用消息来源
      tags:
      - 消息来源管理
  /sources/{id}/enable:
    put:
      consumes:
      - application/json
      description: |-
        启用指定消息来源，需要密码二次验证，恢复消息推送功能。
        ## 使用场景
        1. 重新启用之前停用的来源
        2. 恢复某个来源的消息推送能力
        ## 注意事项
        - 只能启用已停用的来源
        - 启用后该来源的 Token 立即生效
        - 只能启用自己创建的来源
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 密码错误
        - 120102: 来源不存在
        - 120103: 无权限操作
        - 120106: 来源已启用
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 密码验证请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.VerifyPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 启用成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 启用消息来源
      tags:
      - 消息来源管理
  /sources/{id}/token:
    post:
      consumes:
      - application/json
      description: |-
        查询指定消息来源的 Token，需要密码二次验证以确保安全性。
        ## 使用场景
        1. 忘记 Token 时查看
        2. 配置外部系统推送时获取 Token
        ## 注意事项
        - 必须提供正确的用户密码才能查看
        - Token 格式为 src{uuid}，例如：src0196a3b2c4d50000a1b2c3d4e5f67890
        - 只能查看自己创建的来源
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 密码错误
        - 120102: 来源不存在
        - 120103: 无权限查看
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 密码验证请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.VerifyPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 查看成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.SourceTokenResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 查看来源令牌
      tags:
      - 消息来源管理
    put:
      consumes:
      - application/json
      description: |-
        重置指定消息来源的 Token，需要密码二次验证，旧 Token 立即失效。
        ## 使用场景
        1. Token 泄露时紧急重置
        2. 定期更换 Token 以提高安全性
        ## 注意事项
        - 重置后旧 Token 立即失效，使用旧 Token 推送会失败
        - 必须更新所有使用旧 Token 的外部系统配置
        - 新 Token 仅在重置时返回一次，请妥善保存
        - 只能重置自己创建的来源
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 密码错误
        - 120102: 来源不存在
        - 120103: 无权限操作
        - 120104: 重置令牌失败
      parameters:
      - description: 来源ID，在路径中传递
        format: int64
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 密码验证请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.VerifyPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.SourceTokenResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 重置来源令牌
      tags:
      - 消息来源管理
  /user/password:
    put:
      consumes:
      - application/json
      description: |-
        修改当前用户的登录密码，修改成功后所有 Refresh Token 将被撤销，需要重新登录。
        ## 密码要求
        - 8-128 个字符
        - 必须包含小写字母
        - 必须包含大写字母
        - 必须包含数字
        ## 使用场景
        1. 用户定期修改密码
        2. 用户怀疑密码泄露时修改密码
        ## 注意事项
        - 修改密码后所有已登录的设备都需要重新登录
        - 旧密码必须正确才能修改
        - 新密码不能与旧密码相同
        ## 错误码说明
        - 100001: 未提供认证令牌
        - 110200: 旧密码错误
        - 110102: 修改密码失败
      parameters:
      - description: 修改密码请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.ChangePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/octotify_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 用户管理
  /user/profile:
    get:
      consumes:
      - application/json
      description: |-
        获取当前登录用户的个人信息，包括用户 ID、用户名和创建时间。
        ## 使用场景
        1. 页面加载时获取用户信息展示在导航栏
        2. 用户中心页面展示个人信息
        ## 注意事项
        - 需要提供有效的 Access Token
        - 只能查询自己的信息，不能查询其他用户
        ## 错误码说明
        - 100001: 未提供认证令牌或认证令牌无效或已过期
        - 110103: 用户不存在
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.UserDTO'
              type: object
      security:
      - BearerAuth: []
      summary: 查询用户信息
      tags:
      - 用户管理
  /user/register:
    post:
      consumes:
      - application/json
      description: |-
        注册新用户账号，注册成功后自动登录并返回 Access Token 和 Refresh Token。
        ## 密码要求
        - 8-128 个字符
        - 必须包含小写字母
        - 必须包含大写字母
        - 必须包含数字
        ## 使用场景
        1. 新用户首次创建账号
        2. 管理员为用户创建账号
        ## 注意事项
        - 用户名唯一，重复注册会返回错误
        - 注册成功后请妥善保存返回的 Token
        - 密码加密存储，系统无法查看原始密码
        ## 错误码说明
        - 110100: 用户名已存在
        - 110101: 注册失败
      parameters:
      - description: 注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.AuthResp'
              type: object
      summary: 用户注册
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    description: 输入格式：Bearer {access_token}，例如：Bearer eyJhbGciOiJSUzI1NiIs...
    in: header
    name: Authorization
    type: apiKey
  SourceTokenAuth:
    description: 推送消息时使用 Source Token，输入格式：Bearer src{uuid}，例如：Bearer src0196a3b2c4d50000a1b2c3d4e5f67890
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 用户登录、退出登录、刷新令牌等认证相关接口
  name: 用户认证
- description: 用户注册、修改密码、查询用户信息等管理接口
  name: 用户管理
- description: 创建、编辑、删除消息来源，管理来源令牌等接口
  name: 消息来源管理
- description: 创建、编辑、删除推送渠道，测试渠道连接等接口
  name: 推送渠道管理
- description: 查询消息列表、筛选消息、查看消息详情、删除消息等接口
  name: 消息管理
- description: 外部系统通过 Source Token 推送消息到平台
  name: 消息推送
