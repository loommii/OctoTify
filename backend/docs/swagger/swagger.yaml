  /push/{token}:
    post:
      consumes:
      - application/json
      description: |-
        外部系统通过 Source Token 推送消息到平台，消息会被并发推送到所有绑定的有效渠道。
        ## 认证方式
        使用 Source Token 进行认证，而非用户 Access Token。
        Token 格式：src{uuid}，例如：src0196a3b2c4d50000a1b2c3d4e5f67890
        ## 推送流程
        1. 系统验证 Source Token 有效性
        2. 查找该来源绑定的所有启用状态的渠道
        3. 并发推送到所有渠道
        4. 返回各渠道的推送结果
        ## 使用场景
        1. CI/CD 流水线推送构建结果
        2. 监控系统推送告警信息
        3. 业务系统推送通知消息
        ## 注意事项
        - Source Token 通过 URL 路径参数传递
        - 消息会并发推送到所有绑定的有效渠道
        - 返回结果包含每个渠道的推送状态
        - 推送失败不影响其他渠道的推送
        - 来源被停用后无法推送消息
        ## 错误码说明
        - 120400: 来源 Token 无效
        - 120401: 来源已停用
        - 120402: 来源不存在
        - 120403: 没有可用的推送渠道
        - 120404: 推送消息失败
      parameters:
      - description: 来源 Token，格式为 src{uuid}
        in: path
        name: token
        required: true
        type: string
      - description: 推送消息请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/octotify_internal_handler_dto.PushMessageReq'
      produces:
      - application/json
      responses:
        "200":
          description: 推送成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/octotify_internal_handler_dto.PushResponse'
              type: object
      security:
      - SourceTokenAuth: []
      summary: 推送消息
      tags:
      - 消息推送
