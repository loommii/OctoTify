      parameters:
      - default: 1
        description: 页码，从 1 开始，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页条数，默认 20，最大 100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/octotify_pkg_response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/octotify_pkg_response.PageResult'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/octotify_internal_handler_dto.SourceDTO'
                        type: array
                    type: object
              type: object
      security:
